<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container justify-content-center align-items-center">
        <form method="post">
            <h1 class="text-center">РЕГИСТРАЦИЯ</h1>
            <div class="form-group">

                <div class="d-grid col-10 mx-auto">
                    <input type="text" placeholder="ФИО" required
                           class="form-control" id="fio" aria-describedby="fio">
                    <input type="email" placeholder="Email" required
                           class="form-control" id="email" aria-describedby="email">
                    <input type="text" placeholder="Login" required
                           class="form-control" id="login" aria-describedby="login">
                    <input type="password" placeholder="Password" required
                           class="form-control" id="password" aria-describedby="password">
                </div>

                <div class="d-grid gap-2 col-10 mx-auto">
                    <button type="submit" class="btn btn-danger">ЗАРЕГЕСТРИРОВАТЬСЯ</button>
                    <a href="/login" type="submit" class="btn btn-primary">ВОЙТИ</a>
                </div>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
